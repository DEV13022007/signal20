spring.application.name=polarconnect

spring.datasource.url=jdbc:postgresql://localhost:5432/polarconnect
spring.datasource.username=polarconnect
spring.datasource.password=polarconnect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# How often the sync queue re-checks stations whose satellite link is already up,
# in case records were queued while the link was active.
polarconnect.sync.sweep-interval-ms=30000

# Demo seed data: wipes and reseeds Maitri/Bharati on every boot. Set to false once
# this is no longer a throwaway prototype.
polarconnect.seed.enabled=true

# Demo-only signing secret — move to an environment variable before this leaves the
# hackathon prototype stage.
polarconnect.jwt.secret=polarconnect-demo-signing-secret-change-before-production-1234567890
polarconnect.jwt.expiration-ms=86400000
